<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Opening Document...</title>
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    if (id) {
      window.location.href = `https://drive.google.com/file/d/${id}/view`;
    } else {
      document.body.innerHTML = "Invalid file.";
    }
  </script>
</head>
<body>
  Opening document...
</body>
</html>
